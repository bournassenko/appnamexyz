name: Validate and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libcairo2 tesseract-ocr liblouis-bin liblouis-data
      - run: uv sync --project services/api --frozen --python 3.12
      - run: uv run --project services/api --frozen pytest services/api/tests -q
      - run: npm ci
        working-directory: apps/web
      - run: npm run check && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for EC2 to deploy the validated revision
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          PUBLIC_URL="$(cat infra/public-url)"
          for attempt in $(seq 1 100); do
            DEPLOYED_RELEASE="$(curl --fail --silent --max-time 15 "$PUBLIC_URL/api/v1/health" | jq -r '.release' || true)"
            if [ "$DEPLOYED_RELEASE" = "$EXPECTED_RELEASE" ]; then
              echo "Validated revision is live over HTTPS."
              exit 0
            fi
            sleep 10
          done
          echo "EC2 did not deploy the expected revision within the verification window."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Verify public browser workflow and accessibility
        run: TEST_BASE_URL="$(cat ../../infra/public-url)" npm test
        working-directory: apps/web
