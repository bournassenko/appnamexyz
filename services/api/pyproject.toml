[project]
name = "accessible-materials-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "pillow>=11", "opencv-python-headless>=4.11", "pytesseract>=0.3.13", "openai>=2,<3", "cairosvg>=2.7", "httpx>=0.28", "pydantic-settings>=2.8", "shapely>=2.1,<3", "pypdf>=5"]
[dependency-groups]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
pythonpath = ["."]
